<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snooker Ladder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snooker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbw6dgbZTQDaNPBKJ6vW66WhHOSWmyLRhXBSmMmcOjqhJm55kYLGVJVch8Jny5_A2PGV/exec';
  // Opened from the home-screen icon: go straight to the ladder
  var standalone = window.navigator.standalone ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f3f7f4; text-align: center;
    background: radial-gradient(120% 70% at 50% -10%, #145a43 0%, rgba(20,90,67,0) 60%), linear-gradient(180deg, #0a3b2c, #052219);
    display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 360px; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  h1 { font-size: 28px; margin: 20px 0 6px; }
  p { color: rgba(243,247,244,.65); line-height: 1.45; margin: 0 0 22px; font-size: 15px; }
  a.btn { display: block; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 17px; text-decoration: none;
    color: #3b2c00; background: linear-gradient(180deg, #f2d27a, #d9ac3a); }
  .tip { margin-top: 22px; font-size: 13px; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #062a1f; display: none; }
  body.app .box { display: none; }
  body.app iframe { display: block; }
</style>
</head>
<body>
  <div class="box">
    <img src="icon-512.png" alt="">
    <h1>Snooker Ladder</h1>
    <p>See the ladder and add results.</p>
    <a class="btn" id="go" href="#">Open the ladder</a>
    <p class="tip">Tip: add this page to your home screen first.<br>
      Android: Chrome menu ⋮ → Add to Home screen<br>
      iPhone: Share → Add to Home Screen</p>
  </div>
  <iframe id="app" title="Snooker Ladder"></iframe>
  <script>
    function openApp() {
      var f = document.getElementById('app');
      if (!f.src) f.src = APP;
      document.body.className = 'app';
    }
    document.getElementById('go').addEventListener('click', function (e) { e.preventDefault(); openApp(); });
    if (standalone) openApp();   // opened from the home-screen icon
  </script>
</body>
</html>
